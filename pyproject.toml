[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "dependency-injector>=4",
  "langchain>=1",
  "langchain-ollama>=1",
  "langchain-qdrant>=1",
  "qdrant-client>=1",
  "fastembed>=0.3",
  "sentence-transformers>=3",
  "boto3>=1",
  "httpx>=0.27",
  "langchain-postgres>=0.0.12",
  "psycopg[binary]>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# App (không phải library) -> wheel không cần chứa file, chỉ để `pip install -e .` cài deps.
[tool.hatch.build.targets.wheel]
bypass-selection = true
